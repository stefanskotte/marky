name: Marky
options:
  bundleIdPrefix: dk.enhance-it
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    # Sparkle compares CFBundleVersion to decide what's newer: keep it equal to the version.
    CURRENT_PROJECT_VERSION: $(MARKETING_VERSION)
    # Debug is ad-hoc signed; Release is signed with the team's Developer ID
    # (scripts/release.sh then notarizes it).
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: 3WT5WSV6B5
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
  configs:
    Debug:
      CODE_SIGN_IDENTITY: "-"
    Release:
      CODE_SIGN_IDENTITY: "Developer ID Application: Stefan Skotte (3WT5WSV6B5)"
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

targets:
  Marky:
    type: application
    platform: macOS
    sources:
      - path: Marky
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.enhance-it.marky
        PRODUCT_NAME: Marky
        CODE_SIGN_ENTITLEMENTS: Marky/Marky.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
      configs:
        Release:
          # Adds the App Group shared with Quick Look (needs the team signature).
          CODE_SIGN_ENTITLEMENTS: Marky/Marky-Release.entitlements
    info:
      path: Marky/Info.plist
      properties:
        CFBundleDisplayName: Marky
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        # In-app updates (Sparkle): the feed is appcast.xml on main; updates must be signed with the
        # EdDSA key whose public half is below (private half: login Keychain, account "marky").
        SUFeedURL: https://raw.githubusercontent.com/stefanskotte/marky/main/appcast.xml
        SUPublicEDKey: AXwtPYmQUqz0pGv1b+ixcYFVSGiSI+ksM8DHghWDB98=
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes: [net.daringfireball.markdown]
          - CFBundleTypeName: Plain Text
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo: [public.plain-text]
            UTTypeReferenceURL: https://daringfireball.net/projects/markdown/
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mdown, mkd, mkdn, mdwn, mdtxt, mdtext]
              public.mime-type: [text/markdown, text/x-markdown]
    dependencies:
      - target: MarkyQuickLook
        embed: true
        codeSign: true
      - package: Sparkle

  MarkyQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - path: QuickLook
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.enhance-it.marky.quicklook
        PRODUCT_NAME: MarkyQuickLook
        CODE_SIGN_ENTITLEMENTS: QuickLook/QuickLook.entitlements
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: QuickLook/QuickLook-Release.entitlements
    info:
      path: QuickLook/Info.plist
      properties:
        CFBundleDisplayName: Marky Quick Look
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewProvider
          NSExtensionAttributes:
            QLIsDataBasedPreview: true
            QLSupportsSearchableItems: false
            QLSupportedContentTypes: [net.daringfireball.markdown]

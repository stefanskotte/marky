name: Marky
options:
  bundleIdPrefix: dk.enhance-it
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Debug is ad-hoc signed; Release is signed with the team's Developer ID
    # (scripts/release.sh then notarizes it).
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: 3WT5WSV6B5
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
  configs:
    Debug:
      CODE_SIGN_IDENTITY: "-"
    Release:
      CODE_SIGN_IDENTITY: "Developer ID Application: Stefan Skotte (3WT5WSV6B5)"
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

targets:
  Marky:
    type: application
    platform: macOS
    sources:
      - path: Marky
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.enhance-it.marky
        PRODUCT_NAME: Marky
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    entitlements:
      path: Marky/Marky.entitlements
      properties:
        # Not sandboxed: needs to read images and linked .md files next to the opened document.
        com.apple.security.app-sandbox: false
    info:
      path: Marky/Info.plist
      properties:
        CFBundleDisplayName: Marky
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes: [net.daringfireball.markdown]
          - CFBundleTypeName: Plain Text
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo: [public.plain-text]
            UTTypeReferenceURL: https://daringfireball.net/projects/markdown/
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mdown, mkd, mkdn, mdwn, mdtxt, mdtext]
              public.mime-type: [text/markdown, text/x-markdown]
    dependencies:
      - target: MarkyQuickLook
        embed: true
        codeSign: true

  MarkyQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - path: QuickLook
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.enhance-it.marky.quicklook
        PRODUCT_NAME: MarkyQuickLook
    entitlements:
      path: QuickLook/QuickLook.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        # Read-only access so previews can show images next to the Markdown file
        # (the sandbox otherwise allows only the previewed file itself).
        com.apple.security.temporary-exception.files.absolute-path.read-only: ["/"]
    info:
      path: QuickLook/Info.plist
      properties:
        CFBundleDisplayName: Marky Quick Look
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewProvider
          NSExtensionAttributes:
            QLIsDataBasedPreview: true
            QLSupportsSearchableItems: false
            QLSupportedContentTypes: [net.daringfireball.markdown]
